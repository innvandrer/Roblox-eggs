name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      LUAU_LSP_VERSION: "1.70.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Auth only raises the GitHub API rate limit for tool downloads.
          rokit authenticate github --token "$GITHUB_TOKEN" --skip-verify || echo "Continuing without Rokit auth"
          rokit install --no-trust-check

      - name: Install Wally packages
        run: wally install

      - name: StyLua
        run: stylua --check src tests

      - name: Selene
        run: |
          selene src
          cd tests && selene .

      - name: Logic tests
        run: lune run tests/run.luau

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/Roblox-eggs.rbxlx

      - name: Check place structure
        run: lune run tests/place.luau build/Roblox-eggs.rbxlx

      - name: Type check (luau-lsp)
        run: |
          curl -sSfL -o globalTypes.d.luau "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LUAU_LSP_VERSION}/scripts/globalTypes.d.luau"
          rojo sourcemap default.project.json --include-non-scripts --output sourcemap.json
          luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json \
            --ignore="Packages/**" --ignore="ServerPackages/**" src

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-eggs-place
          path: build/Roblox-eggs.rbxlx
          if-no-files-found: error
